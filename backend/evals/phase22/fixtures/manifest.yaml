    시드 규모 미니셋(총 37). NLM Q7 목표치 100~500 은 채널 harvest(22-02 Task 3 belle
    greenlight) 완료 후 확장 대상 — 현 시드에서는 전 동작 커버를 규모보다 우선한다.
