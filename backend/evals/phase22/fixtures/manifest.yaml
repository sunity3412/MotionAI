    holdout_gate_move: [climb]        # known not_pole 게이트(정타/fault 둘 다).
    unregistered_moves: [combo, foxtop, invert, sideway-spin, Iron-X, Cocoon, Jade-Split, various]
    note: >-
      등록 5 + climb + 미보유 8 = 14 동작. 등록/게이트 동작은 정타·fault 페어(각 2),
      미보유는 정타 위주(각 1) — kip-up 최다 아님(6동작 공동 최다 2).

