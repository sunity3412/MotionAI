# Phase 22 bake-off 평가 미니셋 (22-05 Task 1 — D-04 bake-off).
#
# 무엇:
#   Qwen 3.6-VL-8B vs InternVL 3.5-8B 를 동일 조건에서 4축(grounding L2 / 시계열 /
#   JSON 준수 / 코칭 judge)으로 재는 bake-off 의 평가 미니셋을 박제한다. 실행(Pod
#   추론)은 22-06 — 이 파일은 어떤 클립/함정/합성 트랙으로 재는지의 계약만 고정한다.
#
# 항목 타입 4종:
#   · real               — 학습 매니페스트(22-02)에서 동작별 균등 추출한 실영상.
#                          등록 5동작(kip-up/power-spin/peter-pan/elbow-twist-sister/
#                          pdshape) + climb + 미보유(unregistered) ≥ 2종. 정타/fault 균형.
#                          bake-off 는 zero-shot 이라 학습 JSONL 과 겹쳐도 오염 아님
#                          (모델은 이 미니셋을 학습에 못 봄 — 프롬프트-시점 추론만).
#   · hard_negative      — 2026-07-06 실증 위양성(A2 피터팬·A3 power-spin). 성공으로
#                          오판하면 안 되는 함정(22-02 holdout 행 인용).
#   · synthetic_grounding — perturb.py 교란 시퀀스. 정답 = 교란 전 원좌표. grounding
#                          L2 의 **유일한** 계측 트랙 — 실영상엔 진짜 정답 좌표가 없다
#                          (Open Question 1, [[analysis-objectivity-no-human-scores]]).
#   · trap               — make_temporal_trap 역재생/순서 셔플. 모델이 영상을 안 보고
#                          시간 순서를 언어 프라이어로 추측하는 shortcut 검출(Pitfall 6).
#                          함정 정답률이 정상과 동일하게 높으면 shortcut 경고.
#
# 객관성 하드가드 ([[analysis-objectivity-no-human-scores]]):
#   · real/hard_negative label = 영상-파생 입력 라벨(정타/fault) — 객관성 OK.
#   · 사람이 매긴 "이 영상 N점" ground-truth 점수 라벨은 영구 금지.
#   · grounding 정답은 합성 원좌표(자가 라벨), 코칭은 judge 가 블라인드로 잰다.
#
# 동시성 ([[pipeline-not-concurrency-safe-eval-serial]]):
#   · bake-off 는 SERIAL — 한 모델·한 항목 순차. 동시 트리거 = cross-contamination.

_meta:
  phase: "22"
  plan: "22-05"
  purpose: "D-04 bake-off (Qwen 3.6-VL-8B vs InternVL 3.5-8B) 평가 미니셋"
  schema_version: ft-v1.0            # schema.py SCHEMA_VERSION 정합.
