    expected_contact_points:
      - {name: left_hand, kind: keypoint}
      - {name: right_hand, kind: keypoint}
      - {name: left_ankle, kind: keypoint}
      - {name: right_ankle, kind: keypoint}
      - {name: hip, kind: region_proxy}
  ref-climb:
    expected_contact_points:
      - {name: left_hand, kind: keypoint}
      - {name: right_hand, kind: keypoint}
      - {name: left_inner_thigh, kind: segment}
