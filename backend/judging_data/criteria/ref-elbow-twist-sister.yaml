# 객관 IPSF 무릎 신전 GeometricCriterion (P1 step 4, 2026-06-27)
# 출처 = 15-IPSF-SOURCING-2026-06-27.md + belle 결정:
#   범주형(micro-bend=0점) 제외 → 비례 감점 유지 / 객관 180° / Mode1 = 프로(정은지) 기준 노출.
# angle_target=180 은 정은지 측정값이 아니라 IPSF 보편 신전기준(객관, ipsf_absolute 트랙).
#   ref-invert 식 정은지-measured BENT_OK(분기 2, reference-relative)와 다른 트랙임에 주의.
# elbow-twist-sister = IPSF Code of Points element 미등재(학원 명칭). element code 날조 금지 —
#   곧아야 할 양 무릎(스플릿 라인 신전, 대칭)만 보편 신전기준으로 채점. minimum_requirement=160°
#   = IPSF micro-bent 경계(180-20). 사람 점수 라벨링 금지.
motion: ref-elbow-twist-sister
source: "객관 IPSF 무릎 신전(180° 보편기준, ipsf_absolute) — 15-IPSF-SOURCING-2026-06-27.md belle 결정. elbow-twist-sister 는 IPSF element 미등재(학원 명칭) → per-move element 요건 미존재. 곧아야 할 양 무릎(스플릿 라인 신전, 대칭)을 IPSF Glossary 'Fully extended leg' 범주형 신전 기준 + 동작 의도된 폼으로 채점. angle_target=180 = 정은지 측정값 아님(객관)."
criteria:
  setup_moment: []
  hold_moment:
    - joint: left_knee
      angle_target: 180.0
      tolerance_full: 20.0
      deduction_per_step: 0.2
      minimum_requirement: 160.0
      source_ref: "IPSF Pole Sports Code of Points Glossary 'Fully extended leg' (범주형 신전 기준, p.130-131) + 동작 의도된 폼(다리 완전 신전, belle 도메인). NotebookLM 확정: 본 동작은 IPSF element 미등재 — element code 날조 금지, 보편 신전기준 적용."
      extension_class: EXTEND
    - joint: right_knee
      angle_target: 180.0
      tolerance_full: 20.0
      deduction_per_step: 0.2
      minimum_requirement: 160.0
      source_ref: "IPSF Pole Sports Code of Points Glossary 'Fully extended leg' (범주형 신전 기준, p.130-131) + 동작 의도된 폼(다리 완전 신전, belle 도메인). NotebookLM 확정: 본 동작은 IPSF element 미등재 — element code 날조 금지, 보편 신전기준 적용."
      extension_class: EXTEND
  peak_moment: []
  release_moment: []
