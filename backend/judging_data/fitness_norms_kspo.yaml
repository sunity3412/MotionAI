# 등급: 국민체력100 인증 3등급 체계 (g1=1등급 최상 ~ g3=3등급).
grades:
  g1: 1등급
  g2: 2등급
  g3: 3등급

# 측정항목 키 (cutoff = 해당 등급 인증 기준값, '이상'이면 통과).
