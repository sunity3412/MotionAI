# 국민체력100 인증기준(등급표) — 연령·성별 체력 규준
#
# 출처: 서울올림픽기념국민체육진흥공단 국민체력100 인증기준
#   https://nfa.kspo.or.kr/reserve/0/selectMeasureGradeItemListByAgeSe.kspo
#   (raw 개인기록 dataset data.go.kr 15108938 = 규준 아님, 미사용)
#
# 추출: 2026-06-16, 페이지 HTML 테이블 직접 파싱.
#   등급 위치추론은 알려진 셀 7개로 교차검증 통과
#   (예: 여13세 1등급 상대악력=44.7 / 남19~24 1등급=62.6 / 남19~24 3등급=51.8).
#
# 용도 (memory [[kspo-fitness-norms-report-context]]):
#   - 리포트 맥락 + 보완운동/코칭 톤 (Phase 13) 전용.
#   - 점수/분석 차원 단정에 사용 금지 (models.py:46 D-05 정합).
#   - 이 항목들은 체육관 측정값이라 폴 영상에서 측정 불가 →
#     사용자 자동 등급 배치 금지. "동작이 요구하는 일반적 체력 수준"
#     교육 맥락 + 연령·성별 맞춤 보완운동 입력으로만 인용.
#   - 상대악력 = 악력(kg)/체중(kg)x100 (%). 체중 정규화 지표라
#     우리가 받는 키·몸무게 입력과 가장 정합.

