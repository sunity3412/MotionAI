# Phase 22 학습셋 소스 레지스트리 (belle 큐레이션, 2026-07-09)
#
# 근거 = .planning/phases/22-custom-vlm-finetune/22-DATA-SOURCES.md +
# 메모리 phase22-data-sourcing-policy-2026-07-09. collect_phase22_youtube.py 가
# 이 파일을 단일 채널/계정 레지스트리로 읽는다.
#
# 정책 (belle 확정):
#   · 수집 = 학습 전용. S3 fixtures/phase22/ (비-notified prefix), usage=
#     training-only-no-redistribution. 앱 미노출·재배포 없음. Mode1 reference 와 별개.
#   · 정타 버킷 = 공식 대회 채널(선수는 정타). 후프/에어리얼후프 종목 제외(폴 아님).
#   · fault/기술 버킷 = 단일강사/스튜디오 튜토리얼(강사 정면·전신·고정캠).
#   · 채널이 아니라 시리즈/영상 단위로 판단. 수집 = 균등 샘플(dump-all 아님;
#     동작별 max <= 2*min, 미보유 동작 >= 2종). per_channel_cap 로 harvest 단계 강제.
#   · 실제 다운로드/S3 적재 = belle greenlight (Task 3). 본 파일 = 열거/필터 규율만.
#
# ── watch 규약 (phase22_watch.py 쌓기 러너, 22-11) ────────────────────────────
#   · phase22_watch.py --run 은 이 레지스트리의 watch 대상을 주기 수집한다.
#   · watch 대상 = 선택 필드 `watch: false` 부재(기본 opt-in). 옵트아웃하려면
#     해당 entry 에 `watch: false` 추가(수집 대상에서 제외, 등재/이력은 보존).
#     - YouTube: enabled=true 채널만 watch(미성년 등 enabled=false 격리 유지).
#     - Instagram: 트랙 전체(IG 어댑터는 enabled 무관 처리 — collect_phase22_instagram).
#   · 신규 채널 등재 형식 (belle 승인 후에만 추가):
#       필수: name / channel_url / platform(youtube|instagram) / tier / bucket(정타|fault) / notes
#       선택: discipline_include(오버라이드) / duration_window / series_include /
#             search / search_query / curation_profile / cap_per_account / enabled / watch
#   · eunji.poledancer(정은지 본인, cap 60)는 watch:false 부재 = watch 대상(주 1회 페이스).

defaults:
  # 종목 필터 — 제목이 include 에 매칭되고 exclude 에 매칭되지 않아야 후보.
  discipline_include: '(?i)(폴|pole)'
  discipline_exclude: '(?i)(후프|hoop|에어리얼|aerial|silk|실크|트라피즈|trapeze)'
  # 단일 루틴 길이 창(초) — 타이틀카드(6/16s)·다인 블록(1000s+) 배제.
  duration_window: [120, 400]
  # 채널·동작별 harvest 상한 (kip-up 편중 방지, dump-all 금지).
  per_channel_cap: 40
  usage: training-only-no-redistribution

# ── Tier-1 정타 — 공식 대회 채널 (YouTube) ──────────────────────────────────
