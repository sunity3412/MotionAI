    notes: 'KPSA 한국협회. 2020~25 한국선수권, 단일선수 4~5분. 폴 계열 166/282.'

  - name: kpsf_official
    channel_url: https://www.youtube.com/@kpsf_official
    platform: youtube
    tier: 1_official
    bucket: 정타
    notes: 'KPSF 한국연맹. POLE ART/POLE SPORTS, AMATEUR~PRO 등급 스펙트럼. 204/276.'

  - name: InternationalPoleSportsFed
