AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Sunity Motion AI — 별도 서버리스 인프라 (기존 sunity.ai EC2 와 완전 분리).
  앱이 직접 호출: POST /upload-url, GET /reference.
  분석은 S3 업로드 이벤트 → SQS → pipeline Lambda (비동기).
  단일 진실: docs/contract.md / backend/backend_CLAUDE.md.

Parameters:
  Stage:
    Type: String
    Default: pilot
    Description: 배포 단계 (파일럿). 리소스 이름 접미사로 사용.
  VideoBucketName:
    Type: String
    Default: sunity-motion-pilot-videos
    Description: >
      영상 원본/결과 S3 버킷명 (전역 고유해야 함).
      ⚠ 이 템플릿은 버킷 자체를 만들지 않는다 — belle 가 awscli 로 직접
      만든 기존 버킷(reference/ 5 영상 포함)을 보존하기 위함. 배포 후
      별도로 버킷 Notification(s3:ObjectCreated:* → AnalysisQueue)을 설정.
      절차는 README 의 "외부 버킷 노티 설정" 섹션 참조.
  FirebaseSaParam:
    Type: String
    Default: /sunity/motion/firebase-sa
    Description: >
      Firebase 서비스 계정 JSON 을 담은 SSM Parameter Store(SecureString) 이름.
      이 템플릿은 비밀값을 만들지 않는다 — 배포 전 콘솔/CLI 로 별도 생성.
  RunpodAnalyzeUrl:
    Type: String
    Default: ""
    Description: >
      RunPod 분석 서버의 POST /analyze 엔드포인트 URL.
      빈 문자열이면 PipelineFunction 이 자체적으로 NLF 추론 시도(폴백, Lambda CPU
      에선 NaN). 운영 배포 시 https://<pod-id>-8000.proxy.runpod.net/analyze.
  RunpodAuthToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      RunPod 서버와 공유하는 인증 토큰. server.py 가 X-RunPod-Token 헤더로 검증.
      RunPod 측 RUNPOD_AUTH_TOKEN 과 정확히 같은 값. NoEcho 로 CFN/콘솔에 마스킹.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 15
    MemorySize: 256
    Layers:
      - !Ref SharedLayer
    Environment:
      Variables:
        VIDEO_BUCKET: !Ref VideoBucketName
        FIREBASE_SA_PARAM: !Ref FirebaseSaParam

Resources:
  # ── 공통 코드 레이어 (sunity_shared) ────────────────────────────────
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub sunity-motion-${Stage}-shared
      ContentUri: shared/
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [arm64]
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.12
      BuildArchitecture: arm64

  # ── 영상 버킷: 외부 — belle 가 awscli 로 사전 생성한 버킷 사용. ─────
  # CloudFormation import 없이 외부 reference 로 두는 이유:
  #  · 기존 reference/ 5 영상이 들어있어 보존 우선
  #  · CFN import 는 절차 복잡 (이전 belle 작업 보존 + 추가 시간)
  # 향후 운영 단에서 SAM 으로 흡수하려면 backend/README.md "CFN import" 절차.
  #
  # 버킷 자체에 필요한 설정(라이프사이클·CORS·Notification)은 README 참조:
  #   1) aws s3api put-bucket-lifecycle-configuration ... (uploads/ 30일 만료)
  #   2) aws s3api put-bucket-cors ...                    (앱 PUT 허용)
  #   3) aws s3api put-bucket-notification-configuration  (s3:ObjectCreated → SQS)

  # ── 분석 비동기 큐 (S3 → SQS → pipeline) ────────────────────────────
  AnalysisQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub sunity-motion-${Stage}-analysis
      VisibilityTimeout: 960   # pipeline Timeout(900) 보다 길게
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AnalysisDLQ.Arn
        maxReceiveCount: 3

  AnalysisDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub sunity-motion-${Stage}-analysis-dlq
      MessageRetentionPeriod: 1209600

  AnalysisQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref AnalysisQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3SendMessage
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt AnalysisQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub arn:aws:s3:::${VideoBucketName}

  # ── HTTP API (앱이 직접 호출하는 2개 라우트) ────────────────────────
  MotionHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowHeaders: [Content-Type, Authorization]
        AllowMethods: [GET, POST, OPTIONS]

  # ── POST /upload-url : presigned PUT URL 발급 (완전 구현) ────────────
  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sunity-motion-${Stage}-upload-url
      CodeUri: functions/upload-url/
      Handler: app.lambda_handler
      Timeout: 10
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub arn:aws:s3:::${VideoBucketName}/uploads/*
        - Statement:
            # SAM SSMParameterReadPolicy 가 leading slash 가 있는 ParameterName 을
            # 잘못 변환해 `parameter//sunity/...` 이중 슬래시 ARN 으로 박는 버그가
            # 있어 명시적 Statement 로 작성. ARN 은 `parameter${name}` 형식이라
            # FirebaseSaParam(`/sunity/motion/firebase-sa`) 의 leading slash 가 그대로 ARN 의 `/` 와 합쳐진다.
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${FirebaseSaParam}
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref MotionHttpApi
            Method: POST
            Path: /upload-url

  # ── GET /reference : 기준 모션 목록 (기준 모션 선택 화면 #9) ─────────
  ReferenceApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sunity-motion-${Stage}-reference
      CodeUri: functions/reference-api/
      Handler: app.lambda_handler
      Timeout: 10
      Policies:
        - Statement:
            # SAM SSMParameterReadPolicy 가 leading slash 가 있는 ParameterName 을
            # 잘못 변환해 `parameter//sunity/...` 이중 슬래시 ARN 으로 박는 버그가
            # 있어 명시적 Statement 로 작성. ARN 은 `parameter${name}` 형식이라
            # FirebaseSaParam(`/sunity/motion/firebase-sa`) 의 leading slash 가 그대로 ARN 의 `/` 와 합쳐진다.
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${FirebaseSaParam}
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref MotionHttpApi
            Method: GET
            Path: /reference

  # ── 분석 파이프라인 (S3→SQS 트리거. #7 에서 ML 채움 — 현재 stub) ────
  PipelineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sunity-motion-${Stage}-pipeline
      CodeUri: functions/pipeline/
      Handler: app.lambda_handler
      # RunPod 위임 모드에서는 Pod 가 202 를 즉시 반환하므로 Lambda 는 수 초 안에 끝남.
      # Timeout 900 은 폴백(직접 NLF) 경로 안전 마진. 위임 모드에선 사실상 사용 안 됨.
      Timeout: 900
      MemorySize: 1024
      Environment:
        Variables:
          RUNPOD_ANALYZE_URL: !Ref RunpodAnalyzeUrl
          RUNPOD_AUTH_TOKEN: !Ref RunpodAuthToken
      Policies:
        - Statement:
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub arn:aws:s3:::${VideoBucketName}/*
        - Statement:
            # SAM SSMParameterReadPolicy 가 leading slash 가 있는 ParameterName 을
            # 잘못 변환해 `parameter//sunity/...` 이중 슬래시 ARN 으로 박는 버그가
            # 있어 명시적 Statement 로 작성. ARN 은 `parameter${name}` 형식이라
            # FirebaseSaParam(`/sunity/motion/firebase-sa`) 의 leading slash 가 그대로 ARN 의 `/` 와 합쳐진다.
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${FirebaseSaParam}
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt AnalysisQueue.Arn
            BatchSize: 1

  # ── 로그 보관 30일 (비용 관리 — backend_CLAUDE.md) ──────────────────
  UploadUrlLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/sunity-motion-${Stage}-upload-url
      RetentionInDays: 30
  ReferenceApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/sunity-motion-${Stage}-reference
      RetentionInDays: 30
  PipelineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/sunity-motion-${Stage}-pipeline
      RetentionInDays: 30

Outputs:
  ApiBaseUrl:
    Description: 앱이 호출할 API 베이스 URL (POST /upload-url, GET /reference)
    Value: !Sub https://${MotionHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  VideoBucket:
    Description: 영상 업로드 S3 버킷
    Value: !Ref VideoBucketName
  AnalysisQueueUrl:
    Description: 분석 비동기 큐 URL
    Value: !Ref AnalysisQueue
